<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <g stroke="#1a1a1a" stroke-width="2.8" fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <!-- F: barra vertical -->
    <line x1="3" y1="6" x2="3" y2="26"/>
    <!-- F: barra superior -->
    <line x1="3" y1="6" x2="12" y2="6"/>
    <!-- Barra central compartida: F crossbar → G notch (ligadura) -->
    <line x1="3" y1="16" x2="28.4" y2="16"/>
    <!-- G: centro (22,16) radio 9, endpoints a ±45°: (28.4, 9.6) y (28.4, 22.4) -->
    <path d="M 28.4 9.6 A 9 9 0 1 0 28.4 22.4 L 28.4 16"/>
  </g>
</svg>
